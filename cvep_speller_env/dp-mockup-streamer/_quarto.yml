project:
  type: website

website:
  sidebar:
    - id: "main"
      contents:
        - section: "Documentation"
          contents:
            - reference/index.qmd

quartodoc:
  package: "mockup_streamer" # name of the package
  source_dir: "mockup_streamer" # as the source code is within this folder

  title: "Documentation for the mockup_streamer"

  options:
    signature_name: full

  # write sidebar where quartodoc writes its content without impacting quarto
  sidebar:
    file: "reference/_mockup_sidebar.yml"

  sections:
    - title: "Lightweight Random Streamer"
      desc: |
        :::{.callout-tip}
        For fast startup when streaming random data, use the lightweight `random_streamer` module.
        This module avoids heavy imports (mne, scipy) and starts in ~0.2s instead of ~1.5s.
        :::

        :::{.callout-info}
        The github repository for this module is located at:
        [https://github.com/bsdlab/dp-mockup-streamer](https://github.com/bsdlab/dp-mockup-streamer)
        :::
      contents:
        - random_streamer.RandomStreamConfig
        - random_streamer.RandomStreamer
        - random_streamer.run_random_stream
        - random_streamer.run_random_stream_thread

    - title: "File-based Streamer"
      desc: |
        :::{.callout-note}
        The file-based streamer requires additional dependencies (`mne`, `pyxdf`).
        Install with: `pip install dp-mockup-streamer[files]`
        :::
      contents:
        - main.MockupStream
        - main.run_stream
        - main.run_mockup_streamer_thread
